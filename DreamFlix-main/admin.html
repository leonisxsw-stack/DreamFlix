    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lenis@1.1.2/dist/lenis.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="auth.js"></script>
    <style>
        .admin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 30px; }
        .admin-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 30px; backdrop-filter: blur(10px); }
        .admin-card h2 { font-size: 1.2rem; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .admin-card h2 i { color: var(--brand); }
        
        .stat-bar { display: flex; gap: 20px; margin-bottom: 30px; }
        .stat-item { flex: 1; padding: 20px; background: rgba(255,255,255,0.02); border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .stat-val { font-size: 1.8rem; font-weight: 900; color: var(--brand); }
        .stat-label { font-size: 0.75rem; color: #808080; text-transform: uppercase; letter-spacing: 1px; }

        .user-list { list-style: none; display: flex; flex-direction: column; gap: 12px; max-height: 400px; overflow-y: auto; }
        .user-item { display: flex; align-items: center; gap: 15px; padding: 12px; border-radius: 12px; background: rgba(255,255,255,0.02); }
        .user-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .user-status { width: 8px; height: 8px; border-radius: 50%; background: #46d369; box-shadow: 0 0 10px #46d369; }

        .form-group { margin-bottom: 15px; }
        .form-label { display: block; font-size: 0.8rem; color: #808080; margin-bottom: 6px; }
        .form-input { width: 100%; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; outline: none; }
        .form-input:focus { border-color: var(--brand); }

        .content-list { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
        .content-item { display: flex; align-items: center; justify-content: space-between; padding: 10px; background: rgba(255,255,255,0.02); border-radius: 10px; }
        .btn-delete { color: #ff4444; cursor: pointer; padding: 8px; transition: 0.2s; }
        .btn-delete:hover { opacity: 0.7; }
        .btn-edit { color: #46d369; cursor: pointer; padding: 8px; transition: 0.2s; }
        .btn-edit:hover { opacity: 0.7; }

        /* Progress Bar */
        .progress-container { display: none; margin-top: 15px; background: rgba(255,255,255,0.05); border-radius: 10px; overflow: hidden; height: 10px; }
        .progress-fill { height: 100%; background: var(--brand); width: 0%; transition: width 0.3s; }
        .upload-status { font-size: 0.75rem; color: var(--muted); margin-top: 5px; text-align: center; }

        @media (max-width: 1024px) { .admin-grid { grid-template-columns: 1fr; } }
    </style>
</head>

<script src="script.js"></script>
<script>
    // --- Secure Access ---
    DFAuth.requireAdmin();

    const _sb = DFAuth._supabase;

    // --- Fetch Real Users Online (active in last 5 min) ---
    async function loadOnlineUsers() {
        const fiveMinAgo = new Date(Date.now() - 5 * 60 * 1000).toISOString();
        const { data, error } = await _sb
            .from('profiles')
            .select('*')
            .gt('last_seen', fiveMinAgo)
            .order('last_seen', { ascending: false });

        if (error) return;

        const list = document.getElementById('user-list');
        list.innerHTML = '';
        document.getElementById('count-users').innerText = data.length;

        data.forEach(u => {
            const li = document.createElement('li');
            li.className = 'user-item';
            li.innerHTML = `
                <img src="${u.avatar_url}" class="user-avatar">
                <div style="flex:1">
                    <div style="font-weight:700;font-size:0.9rem">${u.full_name}</div>
                    <div style="font-size:0.7rem;color:#808080">${u.email}</div>
                </div>
                <div class="user-status"></div>
            `;
            list.appendChild(li);
        });
    }

    async function resetToFree(e) {
        const email = document.getElementById('target-email').value.trim();
        const status = document.getElementById('grant-status');

        if (!email) {
            status.style.color = '#ff4444';
            status.innerText = 'Error: Email required to reset.';
            return;
        }

        const { error } = await _sb
            .from('profiles')
            .update({ subscription_type: 'FREE' })
            .eq('email', email);

        if (error) {
            status.style.color = '#ff4444';
            status.innerText = 'Fail: ' + error.message;
        } else {
            status.style.color = '#46d369';
            status.innerText = `Success: Plan reset to FREE for ${email}.`;
            setTimeout(() => { status.innerText = ''; }, 3000);
            loadOnlineUsers();
        }
    }

    async function updateUserPlan(e) {
        const btn = e.currentTarget;
        const email = document.getElementById('target-email').value.trim();
        const plan = document.getElementById('target-plan').value;
        const status = document.getElementById('grant-status');

        if (!email) {
            status.style.color = '#ff4444';
            status.innerText = 'Error: Email required.';
            return;
        }

        btn.classList.add('loading');
        btn.disabled = true;

        const { error } = await _sb
            .from('profiles')
            .update({ subscription_type: plan })
            .eq('email', email);

        btn.classList.remove('loading');
        
        if (error) {
            btn.disabled = false;
            status.style.color = '#ff4444';
            status.innerText = 'Fail: ' + error.message;
        } else {
            btn.classList.add('loaded');
            status.style.color = '#46d369';
            status.innerText = `Success: Plan updated for ${email}.`;
            setTimeout(() => { 
                btn.classList.remove('loaded');
                btn.disabled = false;
                status.innerText = ''; 
            }, 3000);
            loadOnlineUsers();
        }
    }

    async function applyModeration(e) {
        const btn = e.currentTarget;
        const email = document.getElementById('mod-email').value.trim();
        const newName = document.getElementById('mod-name').value.trim();
        const status = document.getElementById('mod-status');

        if (!email || !newName) {
            status.style.color = '#ff4444';
            status.innerText = 'Error: Email and Name required.';
            return;
        }

        btn.classList.add('loading');
        btn.disabled = true;

        const { error } = await _sb
            .from('profiles')
            .update({ full_name: newName })
            .eq('email', email);

        btn.classList.remove('loading');

        if (error) {
            btn.disabled = false;
            status.style.color = '#ff4444';
            status.innerText = 'Fail: ' + error.message;
        } else {
            btn.classList.add('loaded');
            status.style.color = '#46d369';
            status.innerText = `Success: ${email} renamed to ${newName}.`;
            setTimeout(() => { 
                btn.classList.remove('loaded');
                btn.disabled = false;
                status.innerText = ''; 
            }, 3000);
            loadOnlineUsers();
        }
    }

    async function sendElitePush(e) {
        const btn = e.currentTarget;
        const title = document.getElementById('push-title').value.trim() || "DreamFlix Elite";
        const message = document.getElementById('push-message').value.trim() || "Consultez les nouveautÃ©s ! 🍿";
        const url = document.getElementById('push-url').value.trim() || 'index.html';
        const status = document.getElementById('push-status');

        btn.classList.add('loading');
        btn.disabled = true;

        const { error } = await _sb.from('broadcasts').insert([{ 
            title: title, 
            message: message, 
            url: url,
            type: 'PUSH_ADMIN' 
        }]);

        btn.classList.remove('loading');

        if (error) {
            btn.disabled = false;
            status.style.color = '#ff4444';
            status.innerText = 'Fail: ' + error.message;
        } else {
            btn.classList.add('loaded');
            status.style.color = '#46d369';
            status.innerText = 'Notification PUSH envoyÃ©e avec succÃ¨s !';
            setTimeout(() => { 
                btn.classList.remove('loaded');
                btn.disabled = false;
                status.innerText = ''; 
            }, 3000);
        }
    }

    async function sendDirectAlert(e) {
        const btn = e.currentTarget;
        const email = document.getElementById('da-email').value.trim();
        const title = document.getElementById('da-title').value.trim();
        const message = document.getElementById('da-message').value.trim();
        const status = document.getElementById('da-status');

        if (!email || !title || !message) return alert("Email, Titre et Message requis !");

        btn.classList.add('loading');
        btn.disabled = true;

        // Insert into broadcasts with target_email
        const { error } = await _sb.from('broadcasts').insert([{ 
            title, 
            message, 
            url: 'index.html',
            target_email: email 
        }]);

        btn.classList.remove('loading');

        if (error) {
            btn.disabled = false;
            status.style.color = '#ff4444';
            status.innerText = 'Fail: ' + error.message;
        } else {
            btn.classList.add('loaded');
            status.style.color = '#46d369';
            status.innerText = `Alerte envoyée à ${email} !`;
            document.getElementById('da-message').value = '';
            setTimeout(() => { 
                btn.classList.remove('loaded');
                btn.disabled = false;
                status.innerText = ''; 
            }, 3000);
        }
    }

    // --- Content Management ---
    async function loadContent() {
        const { data, error } = await _sb.from('content').select('*').order('created_at', { ascending: false });
        if (error) return;

        document.getElementById('count-content').innerText = data.length;
        const list = document.getElementById('manage-content-list');
        list.innerHTML = '';

        data.forEach(item => {
            const div = document.createElement('div');
            div.className = 'content-item';
            div.innerHTML = `
                <div style="display:flex;align-items:center;gap:10px">
                    <img src="${item.image_url}" style="width:40px;height:40px;border-radius:4px;object-fit:cover">
                    <div style="font-size:0.85rem;font-weight:600">${item.title}</div>
                </div>
                <div style="display:flex;gap:10px">
                    <i class="fas fa-edit btn-edit" onclick="editItem('${item.id}')"></i>
                    <i class="fas fa-trash btn-delete" onclick="deleteItem('${item.id}')"></i>
                </div>
            `;
            list.appendChild(div);
        });
    }

    async function editItem(id) {
        const { data, error } = await _sb.from('content').select('*').eq('id', id).single();
        if (error) return;

        document.getElementById('form-title').innerHTML = '<i class="fas fa-edit"></i> Edit Content';
        document.getElementById('edit-id').value = data.id;
        document.getElementById('title').value = data.title;
        document.getElementById('category').value = data.category;
        document.getElementById('year').value = data.year;
        
        document.getElementById('submit-btn').innerText = 'Update Content';
        document.getElementById('cancel-edit').style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById('cancel-edit').addEventListener('click', () => {
        document.getElementById('add-content-form').reset();
        document.getElementById('edit-id').value = '';
        document.getElementById('form-title').innerHTML = '<i class="fas fa-plus-circle"></i> Post New Content';
        document.getElementById('submit-btn').innerText = 'Post Video';
        document.getElementById('cancel-edit').style.display = 'none';
    });

    async function deleteItem(id) {
        if (!confirm('Delete this video?')) return;
        const { error } = await _sb.from('content').delete().eq('id', id);
        if (!error) loadContent();
    }

    async function uploadFile(file, bucket) {
        if (!file) return null;
        const ext = file.name.split('.').pop();
        const fileName = `${Math.random().toString(36).substring(2)}-${Date.now()}.${ext}`;
        const filePath = fileName;

        const { data, error } = await _sb.storage.from(bucket).upload(filePath, file);
        if (error) throw error;

        const { data: { publicUrl } } = _sb.storage.from(bucket).getPublicUrl(filePath);
        return publicUrl;
    }

    document.getElementById('add-content-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submit-btn');
        const progress = document.getElementById('progress-container');
        const fill = document.getElementById('progress-fill');
        const status = document.getElementById('upload-status');
        const editId = document.getElementById('edit-id').value;

        btn.classList.add('loading');
        btn.disabled = true;
        progress.style.display = 'block';
        
        try {
            status.innerText = 'Uploading files...';
            fill.style.width = '30%';

            const thumbFile = document.getElementById('thumb-file').files[0];
            const videoFile = document.getElementById('video-file').files[0];

            let imageUrl = null;
            let videoUrl = null;

            if (thumbFile) imageUrl = await uploadFile(thumbFile, 'thumbnails');
            fill.style.width = '60%';
            
            if (videoFile) videoUrl = await uploadFile(videoFile, 'videos');
            fill.style.width = '90%';

            const contentData = {
                title: document.getElementById('title').value,
                category: document.getElementById('category').value,
                year: document.getElementById('year').value || '2024',
                rating: '18+',
                match_percent: '99%'
            };

            if (imageUrl) contentData.image_url = imageUrl;
            if (videoUrl) contentData.video_url = videoUrl;

            let error;
            if (editId) {
                const { error: err } = await _sb.from('content').update(contentData).eq('id', editId);
                error = err;
            } else {
                // For new posts, ensure imageUrl is present (even if fallback)
                if (!imageUrl) contentData.image_url = 'https://via.placeholder.com/1280x720';
                const { error: err } = await _sb.from('content').insert([contentData]);
                error = err;
            }

            if (error) throw error;

            // NEW: Send Real-Time Notification if requested
            const notifyGold = document.getElementById('notify-gold').checked;
            if (notifyGold && !editId) {
                await _sb.from('broadcasts').insert([{
                    title: "NouveautÃ© !",
                    message: `Vient de sortir : ${contentData.title} (${contentData.year})`,
                    url: 'index.html',
                    type: 'NEW_CONTENT'
                }]);
            }

            fill.style.width = '100%';
            status.innerText = editId ? 'Updated successfully!' : 'Posted successfully!';
            
            // Trigger Button Completion
            btn.classList.add('loaded');
            setTimeout(() => {
                btn.classList.add('finished');
                setTimeout(() => {
                    btn.classList.remove('loading', 'loaded', 'finished');
                    btn.disabled = false;
                    document.getElementById('cancel-edit').click();
                    loadContent();
                    progress.style.display = 'none';
                    fill.style.width = '0%';
                }, 2000);
            }, 700);

        } catch (err) {
            console.error(err);
            alert('Error: ' + err.message);
            btn.classList.remove('loading');
            btn.disabled = false;
            progress.style.display = 'none';
        }
    });

    // Handle Edit State for Button
    function updateBtnText(text) {
        document.getElementById('btn-text').innerText = text;
    }

    // --- Init ---
    loadOnlineUsers();
    loadContent();
    setInterval(loadOnlineUsers, 30000); // Refresh online users every 30s
</script>
</body>
</html>
