<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DreamFlix — My List</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lenis@1.1.2/dist/lenis.min.js"></script>
</head>
<body>
<div id="nav-placeholder"></div>
<div id="sidebar-placeholder"></div>

<div class="df-page df-page-with-sidebar">
    <div class="page-shell">
        <h1>My List</h1>
        <p class="page-subtitle">Your saved content</p>

        <div class="df-grid" id="my-list-grid">
            <!-- Dynamic favorites here -->
        </div>

        <div class="empty-state" id="empty-list" style="display:none">
            <div class="icon"><i class="fas fa-bookmark"></i></div>
            <h3>Votre liste est vide</h3>
            <p>Explorez les séries et films et cliquez sur <strong>+</strong> pour les enregistrer ici.</p>
            <br>
            <button class="btn-pill btn-pill-white" onclick="location.href='index.html'">Découvrir</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script src="nav.js"></script>
<script src="script.js"></script>

<script>
    async function loadMyList() {
        if (typeof DFAuth === 'undefined' || !DFAuth._supabase) return;
        const _sb = DFAuth._supabase;
        const user = DFAuth.getUser();
        if (!user) return;

        const grid = document.getElementById('my-list-grid');
        const empty = document.getElementById('empty-list');
        grid.innerHTML = '';

        try {
            // 1. Get favorite IDs
            const { data: favs } = await _sb.from('favorites').select('content_id').eq('user_id', user.sub);
            
            if (!favs || favs.length === 0) {
                empty.style.display = 'block';
                return;
            }

            // 2. Fetch content for those IDs
            const ids = favs.map(f => f.content_id);
            const { data: dbContent, error } = await _sb.from('content').select('*').in('id', ids);

            let allContent = dbContent || [];

            // 3. Handle Hardcoded Episodes (Skibidi TentaFruit)
            const EP_META = {
                'ep1': { title: 'Épisode 1', image_url: 'img/ep1.png', category: 'Série Originale', year: 2026, video_url: 'watch.html?ep=1' },
                'ep2': { title: 'Épisode 2', image_url: 'img/ep2.png', category: 'Série Originale', year: 2026, video_url: 'watch.html?ep=2' },
                'ep3': { title: 'Épisode 3', image_url: 'img/ep3.png', category: 'Série Originale', year: 2026, video_url: 'watch.html?ep=3' },
                'ep4': { title: 'Épisode 4', image_url: 'img/ep4.png', category: 'Série Originale', year: 2026, video_url: 'watch.html?ep=4' },
                'ep6': { title: 'Épisode 6', image_url: 'img/ep6.png', category: 'Série Originale', year: 2026, video_url: 'watch.html?ep=6' },
                'ep7': { title: 'Épisode 7', image_url: 'img/ep7.png', category: 'Série Originale', year: 2026, video_url: 'watch.html?ep=7' },
                'ep8': { title: 'Épisode 8', image_url: 'img/ep8.png', category: 'Série Originale', year: 2026, video_url: 'watch.html?ep=8' },
                'ep9': { title: 'Épisode 9', image_url: 'img/ep9.png', category: 'Série Originale', year: 2026, video_url: 'watch.html?ep=9' },
                'ep10': { title: 'Épisode 10', image_url: 'img/ep10.png', category: 'Série Originale', year: 2026, video_url: 'watch.html?ep=10' },
                'ep11': { title: 'Épisode 11', image_url: 'img/ep11.png', category: 'Série Originale', year: 2026, video_url: 'watch.html?ep=11' },
                'ep12': { title: 'Épisode 12', image_url: 'img/ep12.png', category: 'Série Originale', year: 2026, video_url: 'watch.html?ep=12' },
                'ep14': { title: 'Épisode 14', image_url: 'img/ep14.png', category: 'Série Originale', year: 2026, video_url: 'watch.html?ep=14' },
                'ep15': { title: 'Épisode 15', image_url: 'img/ep15.png', category: 'Série Originale', year: 2026, video_url: 'watch.html?ep=15' },
                'ep16': { title: 'Épisode 16', image_url: 'img/ep16.png', category: 'Série Originale', year: 2026, video_url: 'watch.html?ep=16' },
                'skibidi-tentafruit': { title: "L'Île de la Skibiditentafruit", image_url: 'img/fruit image.jpg', category: 'Série Originale', year: 2026, video_url: 'watch.html' }
            };

            ids.forEach(id => {
                if (EP_META[id] && !allContent.find(c => c.id === id)) {
                    allContent.push({ id, ...EP_META[id] });
                }
            });

            if (allContent.length === 0) {
                empty.style.display = 'block';
            } else {
                empty.style.display = 'none';
                allContent.forEach(item => {
                    grid.appendChild(DFAuth.UI.createCard(item, true));
                });
                
                // Update favorite buttons to 'checked' state
                setTimeout(() => {
                    document.querySelectorAll('.add-fav-btn').forEach(btn => {
                        btn.className = 'fas fa-check';
                        btn.style.color = '#46d369';
                    });
                }, 100);
            }
        } catch (e) { console.error('My List Load failed:', e); }
    }

    window.addEventListener('load', loadMyList);
</script>
</body>
</html>
