<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="style.css">

<body>
<div id="nav-placeholder"></div>
<div id="sidebar-placeholder"></div>

<div class="df-page df-page-with-sidebar">
    <div class="page-shell">
        <h1><i class="fas fa-users" style="color:var(--brand);margin-right:15px"></i>Friends</h1>

            </div>

            <div class="friend-card">
                <div class="friend-avatar" style="background:linear-gradient(135deg,#2A6FDB,#1a237e);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.2rem">M</div>

            <div class="friend-card">
                <div class="friend-avatar" style="background:linear-gradient(135deg,#46d369,#1b5e20);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.2rem">S</div>
                <div class="friend-info">
                    <h4>Sophie</h4>
                    <p>Last seen 2h ago Â· Daredevil</p>
                </div>
                <div style="margin-left:auto;color:#808080;font-size:0.75rem">2h ago</div>
            </div>

        </div>

        <div style="margin-top:40px;text-align:center;">
            <button class="btn-pill btn-pill-ghost" style="display:inline-flex"><i class="fas fa-user-plus"></i> Invite a Friend</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src='auth.js'></script><script src="nav.js"></script>
