<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DreamFlix — Popular</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lenis@1.1.2/dist/lenis.min.js"></script>
</head>
<body>
<div id="nav-placeholder"></div>
<div id="sidebar-placeholder"></div>

<div class="df-page df-page-with-sidebar">
    <div class="page-shell">
        <h1>🔥 Popular Now</h1>
        <p class="page-subtitle">Top 10 en France aujourd'hui</p>

        <!-- Dynamic Top List -->
        <div id="popular-list" style="display:flex;flex-direction:column;gap:15px;margin-top:30px;">
            <!-- Dynamic items here -->
        </div>

        <div class="empty-state" id="empty-popular" style="display:none">
            <div class="icon" style="font-size: 5rem;">🔝</div>
            <h3>Pas encore de classement</h3>
            <p>Ajoutez du contenu pour voir le top 10 se remplir !</p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script src="nav.js"></script>
<script src="script.js"></script>

<script>
    async function loadPopular() {
        if (typeof DFAuth === 'undefined' || !DFAuth._supabase) return;
        const _sb = DFAuth._supabase;
        const { data, error } = await _sb.from('content').select('*').order('match_percent', { ascending: false }).limit(10);
        
        const list = document.getElementById('popular-list');
        const empty = document.getElementById('empty-popular');
        list.innerHTML = '';

        if (error || !data || data.length === 0) {
            empty.style.display = 'block';
        } else {
            empty.style.display = 'none';
            data.forEach((item, index) => {
                const row = document.createElement('div');
                row.style.cssText = "display:flex;align-items:center;gap:20px;padding:15px;background:rgba(255,255,255,0.04);border-radius:12px;cursor:pointer;transition:background 0.2s";
                row.innerHTML = `
                    <div style="font-size:3rem;font-weight:900;color:${index === 0 ? '#E50914' : '#666'};width:50px;text-align:center">${index + 1}</div>
                    <img src="${item.image_url}" style="width:120px;height:68px;object-fit:cover;border-radius:8px" alt="">
                    <div style="flex:1">
                        <div style="font-weight:700">${item.title}</div>
                        <div style="font-size:0.75rem;color:#808080">${item.category} · ${item.year} · ${item.rating}</div>
                        <div style="font-size:0.75rem;color:#46d369;margin-top:4px">${item.match_percent} Match</div>
                    </div>
                `;
                
                if (item.video_url) {
                    row.onclick = () => DFAuth.UI.openPlayer(item.video_url, item.title);
                }
                
                row.onmouseenter = () => row.style.background = 'rgba(255,255,255,0.08)';
                row.onmouseleave = () => row.style.background = 'rgba(255,255,255,0.04)';
                
                list.appendChild(row);
            });
        }
    }
    window.addEventListener('load', loadPopular);
</script>
</body>
</html>
